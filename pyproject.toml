[build-system]
requires = ["setuptools>=72.1,<73", "wheel>=0.43,<0.44"]
build-backend = "setuptools.build_meta"

[project]
name = "periclock"
dynamic = ["version"]
description = "Donor-level peripheral immune age prediction from PBMC expression and cell-type proportions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Software/model licensing is pending rights-holder review. No license is assumed.
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.11.4",
    "anndata==0.11.1",
    "h5py==3.11.0",
    "scikit-learn==1.5.1",
    "joblib==1.4.2",
]

[project.optional-dependencies]
hub = ["huggingface-hub==0.25.2"]
preprocessing = ["scanpy==1.10.2"]
celltypist = ["scanpy==1.10.2", "celltypist==1.6.3"]
symphony = ["scanpy==1.10.2", "symphonypy==0.2.4", "harmonypy==0.0.10"]
bbknn = ["scanpy==1.10.2", "bbknn==1.6.0"]
annotation = [
    "scanpy==1.10.2", "celltypist==1.6.3", "symphonypy==0.2.4",
    "harmonypy==0.0.10", "bbknn==1.6.0",
]
dev = ["pytest==9.0.2"]

[tool.setuptools]
packages = ["periclock"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "periclock._version.__version__"}
